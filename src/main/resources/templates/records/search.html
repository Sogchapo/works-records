<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Records - Works Records System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex flex-col md:flex-row min-h-screen">
        <!-- Sidebar Navigation -->
        <aside class="w-full md:w-64 bg-slate-900 text-white flex flex-col p-4">
            <h1 class="text-xl font-bold mb-4 md:mb-8 text-teal-400">Works Records</h1>
            <nav class="flex flex-row md:flex-col overflow-x-auto md:overflow-visible gap-2 md:gap-0 md:space-y-3 pb-2 md:pb-0">
                <a href="/" class="whitespace-nowrap py-2 px-3 md:px-4 rounded hover:bg-slate-800 text-gray-300 font-medium text-sm md:text-base">Dashboard</a>
                <a href="/records/register" class="whitespace-nowrap py-2 px-3 md:px-4 rounded hover:bg-slate-800 text-gray-300 font-medium text-sm md:text-base">Register Record</a>
                <a href="/reports" class="whitespace-nowrap py-2 px-3 md:px-4 rounded hover:bg-slate-800 text-gray-300 font-medium text-sm md:text-base">Reports & Audit</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-4 sm:p-6 md:p-8 overflow-y-auto">
            <h2 class="text-xl sm:text-2xl font-bold text-gray-800 mb-6">Search Registered Records</h2>

            <!-- Search Form -->
            <form th:action="@{/records/search}" method="get" class="flex flex-col sm:flex-row gap-3 mb-8">
                <input type="text" name="query" th:value="${query}" placeholder="Search by Owner Name, Plot No, Permit No, Digital Address, Town, Phone..." 
                       class="flex-1 p-3 border rounded-lg shadow-sm text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
                <button type="submit" class="w-full sm:w-auto bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-6 rounded-lg shadow text-sm">
                    Search
                </button>
            </form>

            <!-- Results Table -->
            <div class="bg-white p-4 sm:p-6 rounded-lg shadow-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[600px]">
                        <thead>
                            <tr class="border-b text-gray-600 text-xs sm:text-sm bg-gray-50">
                                <th class="p-3">Owner Name</th>
                                <th class="p-3">Plot No.</th>
                                <th class="p-3">Permit No.</th>
                                <th class="p-3">Town</th>
                                <th class="p-3">Status</th>
                                <th class="p-3 text-right sm:text-left">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="rec : ${records}" class="border-b hover:bg-gray-50 text-sm text-gray-700">
                                <td class="p-3 font-medium text-gray-900" th:text="${rec.propertyOwnerName}">John Doe</td>
                                <td class="p-3 whitespace-nowrap" th:text="${rec.plotNumber}">PLT-102</td>
                                <td class="p-3 whitespace-nowrap" th:text="${rec.permitNumber}">PM-9021</td>
                                <td class="p-3 whitespace-nowrap" th:text="${rec.town}">Kumasi</td>
                                <td class="p-3 whitespace-nowrap">
                                    <span class="px-2 py-1 text-xs font-semibold rounded bg-gray-100 text-gray-800" th:text="${rec.status}">PENDING</span>
                                </td>
                                <td class="p-3 whitespace-nowrap text-right sm:text-left">
                                    <a th:href="@{/records/view/{id}(id=${rec.id})}" class="text-teal-600 font-semibold hover:underline">View Record</a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(records)}">
                                <td colspan="6" class="p-4 text-center text-gray-500">No matching records found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
