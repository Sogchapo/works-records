<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Works Records System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs" defer></script>
    <style>
        .bg-login-page {
            background-image: linear-gradient(
                to right bottom,
                rgba(15, 23, 42, 0.10),
                rgba(15, 23, 42, 0.10)
            ),
            url('/images/loginpage.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="bg-login-page min-h-screen flex items-center justify-center p-4 font-sans antialiased">

    <!-- Main Container -->
    <div class="w-full max-w-md flex flex-col items-center">
        
        <!-- Header Title -->
        <h1 class="text-3xl font-extrabold text-white tracking-wider mb-8 uppercase text-center drop-shadow-md">
            USER LOGIN
        </h1>

        <div class="w-full space-y-4">

            <!-- Error Notification Banner -->
            <div th:if="${param.error}" class="p-3 bg-rose-500/80 backdrop-blur-sm border border-rose-400 text-white rounded-2xl text-xs flex items-center gap-2.5 shadow-md">
                <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                </svg>
                <span>Invalid username or password.</span>
            </div>

            <!-- Logout Success Banner -->
            <div th:if="${param.logout}" class="p-3 bg-emerald-500/80 backdrop-blur-sm border border-emerald-400 text-white rounded-2xl text-xs flex items-center gap-2.5 shadow-md">
                <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                </svg>
                <span>Logged out successfully.</span>
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post" class="space-y-4" x-data="{ showPassword: false }">
                
                <!-- CSRF Token Integration for Spring Security -->
                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <!-- Username Field -->
                <div class="relative flex items-center bg-teal-900/40 border border-teal-500/30 rounded-full p-1 backdrop-blur-md focus-within:border-teal-400 transition-all shadow-lg">
                    <div class="w-11 h-11 rounded-full bg-white flex items-center justify-center text-slate-800 flex-shrink-0 shadow">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <input type="text" id="username" name="username" required autofocus placeholder="Username"
                           class="w-full bg-transparent px-4 py-2 text-white placeholder-slate-300 text-sm focus:outline-none">
                </div>

                <!-- Password Field -->
                <div class="relative flex items-center bg-teal-900/40 border border-teal-500/30 rounded-full p-1 backdrop-blur-md focus-within:border-teal-400 transition-all shadow-lg">
                    <input :type="showPassword ? 'text' : 'password'" id="password" name="password" required placeholder="Password"
                           class="w-full bg-transparent pl-6 pr-4 py-2 text-white placeholder-slate-300 text-sm focus:outline-none">
                    
                    <button type="button" @click="showPassword = !showPassword" class="w-11 h-11 rounded-full bg-white flex items-center justify-center text-slate-800 flex-shrink-0 shadow hover:bg-slate-100 transition-colors focus:outline-none">
                        <svg x-show="!showPassword" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
                        </svg>
                        <svg x-show="showPassword" class="w-5 h-5 text-teal-600" fill="currentColor" viewBox="0 0 20 20" style="display: none;">
                            <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                            <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
                        </svg>
                    </button>
                </div>

                <!-- Submit Button -->
                <button type="submit" 
                        class="w-full bg-white hover:bg-slate-100 active:scale-[0.98] text-slate-900 font-extrabold tracking-wider py-3.5 px-6 rounded-full shadow-xl transition-all duration-200 text-sm uppercase mt-4">
                    LOGIN
                </button>
            </form>

        </div>

        <div class="mt-12 text-center">
            <p class="text-xs text-slate-300 font-medium tracking-wide drop-shadow-sm">Works Records Management System &bull; &copy; 2026</p>
        </div>

    </div>

</body>
</html>
