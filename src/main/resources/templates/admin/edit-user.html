<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit User - Works Records System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen">
        <aside class="w-64 bg-slate-900 text-white flex flex-col p-4">
            <h1 class="text-xl font-bold mb-8 text-teal-400">Works Records</h1>
            <nav class="space-y-3">
                <a href="/" class="block py-2 px-4 rounded hover:bg-slate-800 text-gray-300">Dashboard</a>
                <a href="/admin/users" class="block py-2 px-4 rounded bg-slate-800 text-teal-300 font-semibold">User Management</a>
            </nav>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <div class="max-w-xl">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Edit User Account</h2>

                <!-- Error Alert -->
                <div th:if="${error}" class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-md text-sm" th:text="${error}">
                    Error message placeholder
                </div>

                <form th:action="@{/admin/users/update/{id}(id=${user.id})}" th:object="${user}" method="post" class="bg-white p-6 rounded-lg shadow-sm border space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Full Name</label>
                        <input type="text" th:field="*{fullName}" required class="mt-1 w-full p-2 border rounded-md focus:ring-2 focus:ring-teal-500 outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Username</label>
                        <input type="text" th:field="*{username}" required class="mt-1 w-full p-2 border rounded-md focus:ring-2 focus:ring-teal-500 outline-none">
                    </div>

                    <!-- Password Reset Input -->
                    <div class="p-4 bg-slate-50 border rounded-md">
                        <label class="block text-sm font-semibold text-slate-800 mb-1">Reset Password</label>
                        <p class="text-xs text-gray-500 mb-2">Leave blank to keep the user's current password.</p>
                        <input type="password" name="newPassword" placeholder="Enter new password" class="w-full p-2 border rounded-md bg-white focus:ring-2 focus:ring-teal-500 outline-none text-sm">
                    </div>

                    <div class="space-y-3 pt-2">
                        <div class="flex items-center space-x-2">
                            <input type="checkbox" th:field="*{active}" id="active" class="rounded text-teal-600 focus:ring-teal-500">
                            <label for="active" class="text-sm font-medium text-gray-700">Account Active</label>
                        </div>

                        <!-- Superadmin Role Toggle -->
                        <div class="flex items-center space-x-2">
                            <input type="checkbox" name="isSuperadmin" id="isSuperadmin" th:checked="${isSuperadmin}" class="rounded text-teal-600 focus:ring-teal-500">
                            <label for="isSuperadmin" class="text-sm font-medium text-gray-700">Grant Superadmin Access</label>
                        </div>
                    </div>

                    <div class="pt-4 flex justify-end space-x-3 border-t">
                        <a href="/admin/users" class="px-4 py-2 border rounded-md text-gray-600 hover:bg-gray-50 text-sm font-medium">Cancel</a>
                        <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-md shadow text-sm font-semibold transition">
                            Update User
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
