<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User - Works Records</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex flex-col md:flex-row min-h-screen">
        <!-- Sidebar / Navigation -->
        <aside class="w-full md:w-64 bg-slate-900 text-white flex flex-col p-4">
            <h1 class="text-xl font-bold mb-4 md:mb-8 text-teal-400">Works Records</h1>
            <nav class="flex flex-row md:flex-col overflow-x-auto md:overflow-visible gap-2 md:gap-0 md:space-y-3 pb-2 md:pb-0">
                <a href="/" class="whitespace-nowrap py-2 px-3 md:px-4 rounded hover:bg-slate-800 text-gray-300 font-bold text-sm md:text-base">Dashboard</a>
                <a href="/admin/users" class="whitespace-nowrap py-2 px-3 md:px-4 rounded bg-slate-800 text-teal-300 font-bold text-sm md:text-base">User Management</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-4 sm:p-6 md:p-8 overflow-y-auto">
            <h2 class="text-xl sm:text-2xl font-bold text-gray-800 mb-6">Create New System User</h2>

            <div class="bg-white p-4 sm:p-6 rounded-lg shadow-sm border w-full max-w-lg">
                <div th:if="${error}" class="mb-4 p-3 bg-red-100 text-red-700 text-sm rounded" th:text="${error}"></div>

                <form th:action="@{/admin/users/create}" method="post" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name <span class="text-red-500">*</span></label>
                        <input type="text" name="fullName" required class="w-full p-2.5 border rounded-md text-sm focus:ring-2 focus:ring-teal-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Username <span class="text-red-500">*</span></label>
                        <input type="text" name="username" required class="w-full p-2.5 border rounded-md text-sm focus:ring-2 focus:ring-teal-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password <span class="text-red-500">*</span></label>
                        <input type="password" name="password" required class="w-full p-2.5 border rounded-md text-sm focus:ring-2 focus:ring-teal-500">
                    </div>
                    
                    <!-- Role Dropdown Menu -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">User Role <span class="text-red-500">*</span></label>
                        <select name="role" required class="w-full p-2.5 border rounded-md text-sm bg-white focus:ring-2 focus:ring-teal-500 focus:outline-none">
                            <option value="EMPLOYEE" selected>Employee</option>
                            <option value="HOD">Head of Department</option>
                            <option value="SUPERADMIN">Superadmin</option>
                        </select>
                    </div>

                    <div class="flex flex-col-reverse sm:flex-row gap-3 pt-4">
                        <a href="/admin/users" class="w-full sm:w-auto text-center bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2.5 px-4 rounded text-sm">Cancel</a>
                        <button type="submit" class="w-full sm:w-auto bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2.5 px-4 rounded shadow text-sm">Save User</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
