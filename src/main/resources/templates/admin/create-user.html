<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add User - Works Records</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen">
        <aside class="w-64 bg-slate-900 text-white flex flex-col p-4">
            <h1 class="text-xl font-bold mb-8 text-teal-400">Works Records</h1>
            <nav class="space-y-3">
                <a href="/" class="block py-2 px-4 rounded hover:bg-slate-800 text-gray-300">Dashboard</a>
                <a href="/admin/users" class="block py-2 px-4 rounded bg-slate-800 text-teal-300 font-semibold">User Management</a>
            </nav>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Create New System User</h2>

            <div class="bg-white p-6 rounded-lg shadow-sm border max-w-lg">
                <div th:if="${error}" class="mb-4 p-3 bg-red-100 text-red-700 text-sm rounded" th:text="${error}"></div>

                <form th:action="@{/admin/users/create}" method="post" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input type="text" name="fullName" required class="w-full p-2 border rounded-md text-sm focus:ring-2 focus:ring-teal-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                        <input type="text" name="username" required class="w-full p-2 border rounded-md text-sm focus:ring-2 focus:ring-teal-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" name="password" required class="w-full p-2 border rounded-md text-sm focus:ring-2 focus:ring-teal-500">
                    </div>
                    <div class="flex items-center gap-2 pt-2">
                        <input type="checkbox" name="isSuperadmin" id="isSuperadmin" class="rounded text-teal-600 focus:ring-teal-500">
                        <label for="isSuperadmin" class="text-sm font-medium text-gray-700">Grant Superadmin Rights</label>
                    </div>

                    <div class="flex gap-3 pt-4">
                        <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2 px-4 rounded shadow text-sm">Save User</button>
                        <a href="/admin/users" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded text-sm">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
