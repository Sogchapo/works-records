<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Works Records</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex flex-col md:flex-row min-h-screen">
        <!-- Sidebar / Navigation -->
        <aside class="w-full md:w-64 bg-slate-900 text-white flex flex-col p-4 z-10">
            <h1 class="text-xl font-bold mb-4 md:mb-8 text-teal-400">Works Records</h1>
            <nav class="flex flex-row md:flex-col overflow-x-auto md:overflow-visible gap-2 md:gap-0 md:space-y-3 pb-2 md:pb-0">
                <a href="/" class="whitespace-nowrap py-2 px-3 md:px-4 rounded hover:bg-slate-800 text-gray-300 font-medium text-sm md:text-base">Dashboard</a>
                <a href="/records/register" class="whitespace-nowrap py-2 px-3 md:px-4 rounded hover:bg-slate-800 text-gray-300 font-medium text-sm md:text-base">Register Record</a>
                <a href="/reports" class="whitespace-nowrap py-2 px-3 md:px-4 rounded hover:bg-slate-800 text-gray-300 font-medium text-sm md:text-base">Reports</a>
                <a href="/admin/users" class="whitespace-nowrap py-2 px-3 md:px-4 rounded bg-slate-800 text-teal-300 font-semibold text-sm md:text-base">User Management</a>
            </nav>
        </aside>

        <!-- Main Content with Bright Background -->
        <main class="flex-1 p-4 sm:p-6 md:p-8 overflow-y-auto relative bg-[url('/images/bg.jpg')] bg-cover bg-center bg-no-repeat">

            <div class="relative z-10">
                <!-- Alert Notifications -->
                <div th:if="${param.success}" class="mb-4 p-3.5 sm:p-4 bg-green-600/90 text-white rounded-md text-sm font-medium shadow-md">
                    User account created successfully!
                </div>
                <div th:if="${param.updated}" class="mb-4 p-3.5 sm:p-4 bg-blue-600/90 text-white rounded-md text-sm font-medium shadow-md">
                    User details updated successfully!
                </div>
                <div th:if="${param.deleted}" class="mb-4 p-3.5 sm:p-4 bg-red-600/90 text-white rounded-md text-sm font-medium shadow-md">
                    User account removed successfully!
                </div>

                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-6">
                    <h2 class="text-xl sm:text-2xl font-bold text-slate-900 bg-white/70 px-3 py-1 rounded-md backdrop-blur-xs w-fit">User Management</h2>
                    <a href="/admin/users/create" class="inline-block text-center bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2.5 px-4 rounded shadow-md transition text-sm">
                        + Add New User
                    </a>
                </div>

                <!-- Table Container (Horizontal Scrolling for Mobile) -->
                <div class="bg-white/95 rounded-lg shadow-lg border border-gray-200 overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm min-w-[600px]">
                        <thead>
                            <tr class="bg-slate-100 text-gray-700 font-semibold border-b">
                                <th class="p-3">ID</th>
                                <th class="p-3">Full Name</th>
                                <th class="p-3">Username</th>
                                <th class="p-3">Roles</th>
                                <th class="p-3">Status</th>
                                <th class="p-3 text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200">
                            <tr th:each="user : ${users}" class="hover:bg-slate-50 transition">
                                <td class="p-3" th:text="${user.id}">1</td>
                                <td class="p-3 font-medium text-slate-900" th:text="${user.fullName}">Admin</td>
                                <td class="p-3" th:text="${user.username}">superadmin</td>
                                <td class="p-3">
                                    <span th:each="role : ${user.roles}" th:text="${role}" class="inline-block px-2 py-0.5 bg-slate-100 text-slate-700 text-xs rounded mr-1 font-mono border mb-1 sm:mb-0">ROLE</span>
                                </td>
                                <td class="p-3">
                                    <span th:classappend="${user.active ? 'bg-green-100 text-green-800 border-green-200' : 'bg-red-100 text-red-800 border-red-200'}"
                                          class="px-2 py-0.5 rounded text-xs font-semibold border"
                                          th:text="${user.active ? 'Active' : 'Inactive'}">Active</span>
                                </td>
                                <td class="p-3 text-center space-x-1 sm:space-x-2 whitespace-nowrap">
                                    <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" 
                                       class="inline-block bg-blue-50 hover:bg-blue-100 text-blue-600 border border-blue-200 px-3 py-1 rounded text-xs font-semibold transition">
                                        Edit
                                    </a>
                                    <a th:href="@{/admin/users/delete/{id}(id=${user.id})}" 
                                       onclick="return confirm('Are you sure you want to delete this user account?');"
                                       class="inline-block bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-3 py-1 rounded text-xs font-semibold transition">
                                        Delete
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
